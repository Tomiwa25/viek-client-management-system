apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viek-ingress
  namespace: viek-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  rules:
    - host: crm.viek.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: viek-server
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: viek-client
                port:
                  number: 80
