name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: viek_client_management_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./server/prisma/schema.prisma

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/viek_client_management_test_db
        run: npx prisma migrate deploy --schema=./server/prisma/schema.prisma

      - name: Run Tests Across Workspaces
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/viek_client_management_test_db
          JWT_SECRET: ci_pipeline_super_secret_jwt_key_32_characters_minimum!
          PORT: 4000
          MAIL_DRIVER: log
        run: npm test

      - name: Build Production Client Bundle
        run: npm run build

  container-build:
    name: Verify Docker Multi-Stage Images
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: viek-server:ci-test

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: viek-client:ci-test

  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Dry-Run Kustomize Rendering
        run: kubectl kustomize ./k8s
